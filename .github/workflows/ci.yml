name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup mise
        uses: jdx/mise-action@v2

      - name: Install tools
        run: mise install

      - name: Cache Maven deps
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: m2-${{ runner.os }}-${{ hashFiles('deps.edn', 'bb.edn', 'mise.lock', 'mise.toml') }}
          restore-keys: |
            m2-${{ runner.os }}-

      - name: Cache Clojure classpath calc
        uses: actions/cache@v4
        with:
          path: .cpcache
          key: cpcache-${{ runner.os }}-${{ hashFiles('deps.edn', 'bb.edn', 'mise.lock', 'mise.toml') }}
          restore-keys: |
            cpcache-${{ runner.os }}-

      - name: Tool versions
        run: |
          mise ls
          mise exec -- bb --version

      - name: Run quality gate
        run: mise exec -- bb check
